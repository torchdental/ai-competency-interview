<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claim Processing</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #1a1a1a; }
      .page { max-width: 900px; margin: 0 auto; padding: 2rem; }
      nav { background: #fff; border-bottom: 1px solid #e5e5e5; padding: 1rem 2rem; display: flex; gap: 1.5rem; }
      nav a { text-decoration: none; color: #444; font-weight: 500; }
      nav a:hover { color: #000; }
      h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
      h2 { font-size: 1.1rem; margin: 1.25rem 0 0.75rem; }
      .field { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.25rem; }
      label { font-size: 0.875rem; font-weight: 500; color: #555; }
      input { padding: 0.5rem 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem; }
      button { padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
      button[type="submit"] { background: #1a1a1a; color: #fff; margin-top: 1rem; }
      button[type="button"] { background: #e5e5e5; color: #1a1a1a; }
      .procedure-row { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
      .procedure-row input { flex: 1; }
      .error-banner { background: #fee2e2; color: #991b1b; padding: 0.75rem 1rem; border-radius: 4px; margin-bottom: 1rem; }
      .success-banner { background: #dcfce7; color: #166534; padding: 0.75rem 1rem; border-radius: 4px; margin-bottom: 1rem; }
      table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 6px; overflow: hidden; }
      th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #f0f0f0; }
      th { background: #fafafa; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: #666; }
      .status-badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
      .status-pending { background: #fef9c3; color: #854d0e; }
      .status-validated { background: #dbeafe; color: #1e40af; }
      .status-accepted { background: #dcfce7; color: #166534; }
      .status-rejected { background: #fee2e2; color: #991b1b; }
      .actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
      a { color: #1a1a1a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
